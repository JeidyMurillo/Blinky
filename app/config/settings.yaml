# Configuración de Blinky. Los valores por defecto viven en core/config.py.

camera:
  index: 0
  width: 1280
  height: 720
  fps: 30

session:
  initial_seconds: 0        # cada ejecución empieza en cero
  initial_blinks: 0
  blink_rate: 0
  initial_continuous_seconds: 0
  initial_breaks: 0

vision:
  ear_threshold: 0.21       # umbral inicial; la calibración lo ajusta por usuario
  reopen_margin: 0.02       # histéresis: se abre por encima de umbral + margen
  min_closed_frames: 2      # frames cerrados mínimos para confirmar un parpadeo
  max_closed_frames: 15     # reserva para secuencias sin timestamp
  min_blink_duration_ms: 0  # duración mínima; 0 = no descartar parpadeos rápidos
  max_blink_duration_ms: 800  # por encima se clasifica como cierre largo
  long_closure_seconds: 1.5   # cierre prolongado (fatiga/microsueño)
  blink_window_seconds: 60  # ventana para tasa, PERCLOS e intervalos
  min_rate_window_seconds: 10  # evita tasas irreales al inicio
  calibration_seconds: 4    # duración de la calibración inicial
  calibration_min_samples: 24
  calibration_ratio: 0.60   # umbral = EAR abierto (p75) * ratio
  calibration_floor: 0.06   # nunca bajar de este umbral
  calibration_ceiling: 0.28 # ni superar este
  calibration_path: ""      # vacío = app/blinky_calibration.json
  auto_calibrate: true      # recalibrar al iniciar cada sesión
  smoothing_alpha: 0.65     # 1.0 desactiva el suavizado EMA
  processing_width: 640     # se reduce el frame antes de MediaPipe
  use_blendshapes: true     # usar eyeBlink como señal auxiliar
  blink_score_threshold: 0.65
  blink_cooldown_seconds: 0.06
  face_grace_seconds: 0.4   # tolerancia a frames sin rostro
  # min_confidence se centralizó en thresholds: (lo consumen visión y motor).
  overlay_publish_seconds: 0.05  # puntos del overlay enviados a la UI (0 = cada frame)
  model_path: ""            # vacío = caché del usuario (se descarga una vez)
  allow_model_download: true

exposure:
  absent_after_seconds: 10  # tolerancia antes de dejar de contar presencia
  break_min_seconds: 10     # ausencia mínima para validar una pausa (HU-08)

# ---------------------------------------------------------------------------
# Umbrales del motor de decisión (SCRUM-32). Fuente única: este archivo.
# core/config.py DEFAULTS replica estos valores cuando no hay YAML (pruebas).
# No escribir números de umbral en decision/*.py ni en la interfaz.
# Cada valor lleva su fuente o justificación en el comentario.
# ---------------------------------------------------------------------------
bus:
  topics:
    exposure_metrics: exposure.metrics
    exposure_break: exposure.break
    exposure_presence: exposure.presence

thresholds:
  min_confidence: 0.35         # Confianza mínima de landmarks: por debajo se ignora la muestra. MediaPipe da >0.5 con rostro visible; 0.35 tolera luz baja y gafas.
  blink_rate_low: 15           # bpm por debajo de lo normal frente a pantalla (~15-20 bpm). Sustituye el 10 del prototipo, que avisaba tarde.
  blink_warmup_seconds: 20     # s de gracia al arrancar: la ventana de BlinkMetrics necesita 10 s y los primeros valores son inestables.
  blink_low_window_seconds: 60 # ventana de confirmación de tasa baja: evita alertar por una sola muestra atípica (SCRUM-29).
  blink_low_min_samples: 3     # muestras mínimas dentro de la ventana para confirmar la baja tasa (SCRUM-29).
  blink_low_max_gap_seconds: 60 # si transcurre más tiempo sin muestras, se reinicia la ventana (SCRUM-29).
  perclos_high: 0.15           # 15% del tiempo con ojos cerrados en 60 s; referencia habitual de fatiga en estudios PERCLOS.
  long_closures_per_minute: 3  # cierres >1.5 s por minuto (ver vision.long_closure_seconds): 3 o más sugiere microsueño.
  continuous_minutes: 20       # regla 20-20-20 de la American Academy of Ophthalmology: pausa cada 20 min.
  cooldown_seconds: 300        # 5 min sin repetir la misma alerta; antes estaba fijo en DecisionEngine y generaba avisos redundantes.
  lux_min: 300                 # lux mínimos para lectura en interiores (guías de iluminación de oficina / EN 12464-1).
  lux_max: 1000                # lux máximos antes de considerar deslumbramiento sobre la pantalla.
  temperature_min: 18          # °C, extremo inferior de confort de ASHRAE 55 / ISO 7730 para oficinas.
  temperature_max: 26          # °C, extremo superior de confort de ASHRAE 55 / ISO 7730 para oficinas.
  humidity_min: 30             # %HR: por debajo aumenta la sequedad ocular (ASHRAE recomienda 40-60%; 30 da tolerancia en aulas).
  humidity_max: 60             # %HR: por encima aparece bochorno y riesgo de moho (ASHRAE 55).

mqtt:
  enabled: false           # true cuando el ESP32 y el broker estén activos
  host: 127.0.0.1
  port: 1883
  keepalive: 30
  qos: 0                    # telemetría ambiental: QoS 0, retain false
  topics:
    ambient: fatiga/ambient
    status: fatiga/ambient/status
    blink: fatiga/blink

ambient:
  stale_after_seconds: 15   # sin lecturas durante este tiempo -> desconectado

# Fuente de datos del runtime:
#   ui        -> deja la simulación dentro de AppState (comportamiento anterior)
#   simulated -> runtime/simulated.py publica eventos sin hardware
#   real      -> runtime/pipeline.py usa la cámara compartida con la UI
runtime:
  source: real              # real = cámara + MediaPipe; simulated = demo sin hardware
  publish_seconds: 0.5
  frame_interval_ms: 40     # ~25 fps de procesamiento de visión
  auto_start_camera: false  # true si quieres que el pipeline abra la cámara solo
  simulated:
    blink_rate: 18.0
    ambient_seconds: 5.0
    jitter: 2.0
    # Centro de las lecturas ambientales simuladas. Cambialos para probar las
    # recomendaciones sin ESP32: lux 120 (baja) o 1400 (alta), temperatura 14 o
    # 30, humedad 20 (seca) o 75 (humeda).
    ambient_lux: 420
    ambient_temperature: 23.4
    ambient_humidity: 48

storage:
  enabled: true
  path: ""                  # vacío = app/blinky.db
  retention_days: 90

# Levanta Mosquitto en el puerto 1883.
#   docker compose up -d
#   docker compose logs -f mosquitto
#
# Luego activa mqtt.enabled: true en app/config/settings.yaml.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: blinky-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
